<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 70" fill="none">
  <defs>
    <linearGradient id="bodyGradSvg" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="headGradSvg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="starGradSvg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="starGlowSvg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" floodColor="#F59E0B" floodOpacity="0.4" />
    </filter>
  </defs>

  <!-- Left Icon (Enlarged 100%) -->
  <g transform="translate(-10, -3) scale(0.95)">
    <!-- Head Circle -->
    <circle cx="47" cy="30" r="11" fill="url(#headGradSvg)" />
    <!-- Dynamic Torso -->
    <path
      d="M 24 64 C 29 55 35 44 46 39 C 55 35 63 26 66 23 C 65 30 63 39 58 48 C 50 60 40 65 24 64 Z"
      fill="url(#bodyGradSvg)"
    />
    <path
      d="M 24 64 C 36 65 47 58 55 49 C 62 40 64 30 66 23 C 68 20 64 22 61 25 C 50 35 40 46 32 55 C 27 59 25 62 24 64 Z"
      fill="#38BDF8"
      opacity="0.6"
    />
    <!-- Star -->
    <g transform="translate(68, 20) rotate(12)" filter="url(#starGlowSvg)">
      <polygon
        points="0,-15 4.5,-4.5 15.5,-4 7,4 10,15 0,8.5 -10,15 -7,4 -15.5,-4 -4.5,-4.5"
        fill="url(#starGradSvg)"
      />
    </g>
  </g>

  <!-- Right Text (No English) -->
  <text x="76" y="44" font-family="'Noto Sans TC', sans-serif" font-size="26" font-weight="900" fill="#0F172A">小管家兒童理財</text>
</svg>
